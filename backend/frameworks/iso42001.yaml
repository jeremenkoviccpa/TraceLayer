key: iso42001
display_name: ISO/IEC 42001 AI Management System
current_version: "2023"
source_url: https://www.iso.org/standard/81230.html
versions:
  - version: "2023"
    display_name: "ISO/IEC 42001:2023"
    published_at: "2023-12-18"
    is_current: true
controls:
  - external_id: Cl.4-5
    name: AI Governance and Leadership
    category: ai_governance
    description: "Top management must establish, maintain, and continually improve an AI Management System (AIMS). Clause 4 requires understanding internal/external context and interested parties. Clause 5 requires a formal AI policy, defined organizational roles, and management accountability for AI objectives. Evidence includes AI governance policies, board-level AI charters, role assignments, and management review records."

  - external_id: Cl.6.1
    name: AI Risk Assessment and Treatment
    category: ai_risk_management
    description: "Organizations must perform systematic AI risk assessments covering risks to individuals, groups, and society from AI system behaviour (Clause 6.1). A risk treatment plan must address identified risks through technical controls, human oversight, or system modification. Evidence includes AI risk registers, impact assessments, risk treatment plans, and residual risk acceptance records."

  - external_id: Cl.6.2
    name: AI Objectives and Planning
    category: ai_governance
    description: "Measurable AI objectives must be established, aligned to the AI policy, and communicated across the organization (Clause 6.2). Plans must specify what will be done, resources required, responsible parties, timelines, and how results will be evaluated. Evidence includes AI roadmaps, OKR/KPI records, planning documents, and objective review minutes."

  - external_id: Cl.7
    name: Support — Resources, Competence, and Awareness
    category: ai_competence
    description: "Organizations must ensure personnel working on AI systems are competent via education, training, or experience (Clause 7.2). An awareness programme covering the AI policy, AI risks, and individual responsibilities is required (Clause 7.3). Documented information must be controlled (Clause 7.5). Evidence includes training completion records, competency matrices, awareness campaigns, and document management logs."

  - external_id: Cl.8.3
    name: AI System Impact Assessment
    category: ai_impact_assessment
    description: "Before deploying an AI system, organizations must conduct an AI system impact assessment (AISIA) evaluating potential impacts on individuals, groups, and society (Clause 8.3). The assessment must cover intended use, reasonably foreseeable misuse, and interactions with humans. Evidence includes AISIA documents, pre-deployment review sign-offs, and stakeholder consultation records."

  - external_id: Cl.8.4
    name: AI Data Management and Training Data Governance
    category: data_governance
    description: "Organizations must implement controls over data used across the AI system lifecycle — collection, processing, labelling, and storage (Clause 8.4). Data quality, provenance, bias, and representativeness must be assessed. Special categories of sensitive data require additional controls. Evidence includes data governance policies, data quality reports, bias audits, data lineage records, and labelling guidelines."

  - external_id: Cl.8.5
    name: AI System Development, Testing, and Validation
    category: ai_development
    description: "AI systems must be developed and tested following documented procedures covering design specifications, training, validation, and performance benchmarking (Clause 8.5). Accuracy, robustness, and security testing must be performed before production deployment. Evidence includes model cards, test results, validation reports, performance benchmarks, and security testing artefacts."

  - external_id: Cl.8.6
    name: Human Oversight and Accountability
    category: human_oversight
    description: "Appropriate human oversight mechanisms must be designed into AI systems to allow intervention, correction, and shutdown (Clause 8.6). Systems must not override human decisions without explicit design intent. Accountability must be traceable to individuals. Evidence includes oversight policies, human-in-the-loop workflow records, intervention logs, and accountability matrices."

  - external_id: Cl.9
    name: Performance Evaluation and Monitoring
    category: ai_monitoring
    description: "Organizations must monitor, measure, analyse, and evaluate AI system performance in production (Clause 9.1). Internal audits of the AIMS must be conducted at planned intervals (Clause 9.2). Management reviews must assess AIMS suitability, adequacy, and effectiveness (Clause 9.3). Evidence includes model performance dashboards, drift detection logs, internal audit reports, and management review minutes."

  - external_id: Cl.10
    name: Continual Improvement and Corrective Action
    category: continual_improvement
    description: "Nonconformities must be identified, investigated, corrected, and subject to root-cause analysis with corrective actions (Clause 10.1). The AIMS must be continually improved to enhance performance and address emerging AI risks (Clause 10.2). Evidence includes nonconformity records, corrective action plans, lessons-learned logs, and improvement tracking registers."

  - external_id: A.6.1
    name: Transparency and Explainability
    category: transparency
    description: "Annex A Control 6.1 requires appropriate transparency of AI systems to stakeholders — disclosing when AI is in use, providing meaningful explanations of AI-driven decisions, and maintaining explainability appropriate to the application context and regulatory requirements. Evidence includes transparency notices, explainability documentation (SHAP/LIME analyses), model cards, and decision explanation logs."

  - external_id: A.6.2
    name: Bias Detection and Fairness
    category: fairness
    description: "Annex A Control 6.2 requires identifying, assessing, and mitigating harmful bias in AI system outputs across protected characteristics and demographic groups. Fairness metrics must be defined and continuously monitored. Evidence includes bias audit reports, fairness metric dashboards, demographic parity analyses, mitigation records, and re-testing results after bias remediation."

  - external_id: A.8.2
    name: Privacy and Data Protection in AI Systems
    category: ai_privacy
    description: "Annex A Control 8.2 requires integrating data protection principles into AI system design and operation — data minimisation, purpose limitation, and privacy-enhancing technologies (differential privacy, federated learning, synthetic data). Data protection impact assessments for AI processing must be conducted. Evidence includes AI DPIA records, privacy-by-design documentation, and data minimisation audit results."

  - external_id: A.9.1
    name: AI Incident Management and Reporting
    category: ai_incident_management
    description: "Annex A Control 9.1 requires procedures for detecting, recording, investigating, and responding to AI-specific incidents including unexpected outputs, performance degradation, safety failures, and security breaches affecting AI systems. Post-incident analysis and model recall/rollback capabilities are required. Evidence includes AI incident records, post-incident analyses, rollback logs, and incident response playbooks."

  - external_id: A.10.1
    name: AI Supplier and Third-Party Management
    category: ai_supply_chain
    description: "Annex A Control 10.1 requires assessing and managing risks introduced by third-party AI components, models, datasets, and services. Supplier AI governance capabilities must be evaluated. Contractual requirements for AI transparency, auditability, and incident notification must be established. Evidence includes AI supplier assessments, due diligence records, supplier AI contracts, and third-party model audit reports."
