    is_current: false
controls:
  - external_id: "1798.100"
    name: Right to Know About Personal Information Collected
    category: consumer_rights
    description: "A consumer shall have the right to request that a business that collects a consumer's personal information disclose to that consumer the categories and specific pieces of personal information the business has collected."
  - external_id: "1798.105"
    name: Right to Deletion
    category: consumer_rights
    description: "A consumer shall have the right to request that a business delete any personal information about the consumer which the business has collected from the consumer."
  - external_id: "1798.106"
    name: Right to Correction
    category: consumer_rights
    description: "A consumer shall have the right to request that a business that collects personal information about the consumer correct inaccurate personal information that a business maintains about the consumer."
  - external_id: "1798.110"
    name: Right to Know Categories of Personal Information
    category: consumer_rights
    description: "A consumer shall have the right to request that a business that collects personal information disclose the categories of personal information collected, sources, business purposes, and third parties with whom it is shared."
  - external_id: "1798.115"
    name: Right to Know About Sale or Disclosure for Business Purpose
    category: consumer_rights
    description: "A consumer shall have the right to request that a business that sells the consumer's personal information disclose the categories sold to third parties and categories disclosed for a business purpose."
  - external_id: "1798.120"
    name: Right to Opt-Out of Sale or Sharing
    category: consumer_rights
    description: "A consumer shall have the right, at any time, to direct a business that sells or shares personal information about the consumer to third parties not to sell or share the consumer's personal information."
  - external_id: "1798.121"
    name: Right to Limit Use of Sensitive Personal Information
    category: consumer_rights
    description: "A consumer shall have the right, at any time, to direct a business that collects sensitive personal information about the consumer to limit its use and disclosure of the consumer's sensitive personal information."
  - external_id: "1798.125"
    name: Non-Discrimination for Exercising Rights
    category: consumer_rights
    description: "A business shall not discriminate against a consumer because the consumer exercised any of the consumer's rights, including by denying goods or services or charging different prices."
  - external_id: "1798.130"
    name: Methods for Submitting Requests
    category: business_obligations
    description: "A business shall make available to consumers two or more designated methods for submitting requests for information, including a toll-free telephone number and a website address."
  - external_id: "1798.135"
    name: Opt-Out Notice and Privacy Policy Requirements
    category: business_obligations
    description: "A business that sells or shares consumers' personal information shall provide a clear and conspicuous link titled Do Not Sell or Share My Personal Information on its internet homepage."
  - external_id: "1798.140(ae)"
    name: Sensitive Personal Information Definition and Handling
    category: business_obligations
    description: "Sensitive personal information including Social Security numbers, financial account information, geolocation data, racial or ethnic origin, and health information shall be handled with heightened protections."
  - external_id: "1798.150"
    name: Private Right of Action for Data Breaches
    category: enforcement
    description: "Any consumer whose nonencrypted and nonredacted personal information is subject to an unauthorized access and exfiltration, theft, or disclosure as a result of a business's failure to implement reasonable security procedures may institute a civil action."
  - external_id: "1798.155"
    name: AG Enforcement and Civil Penalties
    category: enforcement
    description: "Any business, service provider, contractor, or other person that violates this title shall be subject to an injunction and liable for a civil penalty not to exceed $2,500 per violation or $7,500 per intentional violation."
  - external_id: "1798.185(a)(15)"
    name: Automated Decision-Making Technology Opt-Out
    category: consumer_rights
    description: "Businesses that use automated decision-making technology shall provide consumers the right to opt-out of the use of such technology and to obtain an explanation of a decision made using such technology."
  - external_id: "1798.185(a)(16)"
    name: Annual Cybersecurity Audit Requirement
    category: business_obligations
    description: "Businesses whose processing of consumers' personal information presents significant risk to consumer privacy or security shall perform an annual cybersecurity audit and submit a risk assessment to the California Privacy Protection Agency."
