key: iso27001
display_name: ISO/IEC 27001
current_version: "2022"
source_url: https://www.iso.org/standard/27001
versions:
  - version: "2022"
    display_name: "ISO 27001:2022"
    published_at: "2022-10-25"
    is_current: true
  - version: "2013"
    display_name: "ISO 27001:2013"
    published_at: "2013-10-01"
    is_current: false
controls:
  - external_id: A.5.1
    name: Information Security Policies
    category: organizational_controls
    description: "Policies for information security shall be defined and approved by management."
  - external_id: A.5.2
    name: Information Security Roles and Responsibilities
    category: organizational_controls
    description: "Information security roles and responsibilities shall be defined and allocated."
  - external_id: A.5.3
    name: Segregation of Duties
    category: organizational_controls
    description: "Conflicting duties and conflicting areas of responsibility shall be segregated."
  - external_id: A.5.4
    name: Management Responsibilities
    category: organizational_controls
    description: "Management shall require all personnel to apply information security."
  - external_id: A.5.5
    name: Contact with Authorities
    category: organizational_controls
    description: "The organization shall maintain appropriate contacts with relevant authorities."
  - external_id: A.5.7
    name: Threat Intelligence
    category: organizational_controls
    description: "Information relating to information security threats shall be collected and analyzed."
  - external_id: A.5.8
    name: Information Security in Project Management
    category: organizational_controls
    description: "Information security shall be integrated into project management."
  - external_id: A.5.9
    name: Inventory of Information and Other Assets
    category: asset_management
    description: "An inventory of information and other associated assets shall be developed and maintained."
  - external_id: A.5.10
    name: Acceptable Use of Assets
    category: asset_management
    description: "Rules for the acceptable use and procedures for handling information shall be identified."
  - external_id: A.5.11
    name: Return of Assets
    category: asset_management
    description: "Personnel and other interested parties shall return all the organization's assets upon change or termination."
  - external_id: A.5.12
    name: Classification of Information
    category: asset_management
    description: "Information shall be classified according to the information security needs of the organization."
  - external_id: A.5.13
    name: Labelling of Information
    category: asset_management
    description: "An appropriate set of procedures for information labelling shall be developed."
  - external_id: A.5.14
    name: Information Transfer
    category: asset_management
    description: "Information transfer rules, procedures, or agreements shall be in place."
  - external_id: A.5.15
    name: Access Control
    category: access_control
    description: "Rules to control physical and logical access to information and other associated assets shall be established."
  - external_id: A.5.16
    name: Identity Management
    category: access_control
    description: "The full life cycle of identities shall be managed."
  - external_id: A.5.17
    name: Authentication Information
    category: access_control
    description: "Allocation and management of authentication information shall be controlled."
  - external_id: A.5.18
    name: Access Rights
    category: access_control
    description: "Access rights to information and other associated assets shall be provisioned, reviewed, modified and removed."
  - external_id: A.5.23
    name: Information Security for Cloud Services
    category: supplier_relationships
    description: "Processes for acquisition, use, management and exit from cloud services shall be established."
  - external_id: A.5.24
    name: Information Security Incident Management Planning
    category: incident_management
    description: "The organization shall plan and prepare for managing information security incidents."
  - external_id: A.5.25
    name: Assessment and Decision on Security Events
    category: incident_management
    description: "The organization shall assess information security events and decide if they are to be categorized as incidents."
  - external_id: A.5.26
    name: Response to Information Security Incidents
    category: incident_management
    description: "Information security incidents shall be responded to in accordance with documented procedures."
  - external_id: A.5.28
    name: Collection of Evidence
    category: incident_management
    description: "The organization shall establish and implement procedures for the identification, collection, acquisition and preservation of evidence."
  - external_id: A.5.29
    name: Business Continuity
    category: business_continuity
    description: "The organization shall plan how to maintain information security at an appropriate level during disruption."
  - external_id: A.5.30
    name: ICT Readiness for Business Continuity
    category: business_continuity
    description: "ICT readiness shall be planned, implemented, maintained and tested based on business continuity objectives."
  - external_id: A.5.31
    name: Legal, Statutory, Regulatory Requirements
    category: compliance
    description: "Legal, statutory, regulatory and contractual requirements relevant to information security shall be identified."
  - external_id: A.5.33
    name: Protection of Records
    category: compliance
    description: "Records shall be protected from loss, destruction, falsification, unauthorized access and unauthorized release."
  - external_id: A.5.34
    name: Privacy and Protection of Personal Information
    category: compliance
    description: "The organization shall identify and meet the requirements for privacy and protection of personal information."
  - external_id: A.6.1
    name: Screening
    category: people_controls
    description: "Background verification checks on all candidates shall be carried out prior to joining the organization."
  - external_id: A.6.2
    name: Terms and Conditions of Employment
    category: people_controls
    description: "The employment contractual agreements shall state the personnel's and the organization's responsibilities for information security."
  - external_id: A.6.3
    name: Information Security Awareness, Education and Training
    category: people_controls
    description: "Personnel shall receive appropriate information security awareness, education and training."
  - external_id: A.6.4
    name: Disciplinary Process
    category: people_controls
    description: "A disciplinary process shall be formalized and communicated to take actions against personnel who have committed an information security policy violation."
  - external_id: A.6.5
    name: Responsibilities After Termination or Change of Employment
    category: people_controls
    description: "Information security responsibilities and duties that remain valid after termination or change of employment shall be defined, enforced and communicated."
  - external_id: A.7.1
    name: Physical Security Perimeters
    category: physical_controls
    description: "Security perimeters shall be defined and used to protect areas that contain information."
  - external_id: A.7.4
    name: Physical Security Monitoring
    category: physical_controls
    description: "Premises shall be continuously monitored for unauthorized physical access."
  - external_id: A.8.1
    name: User Endpoint Devices
    category: technological_controls
    description: "Information stored on, processed by or accessible via user endpoint devices shall be protected."
  - external_id: A.8.2
    name: Privileged Access Rights
    category: technological_controls
    description: "The allocation and use of privileged access rights shall be restricted and managed."
  - external_id: A.8.3
    name: Information Access Restriction
    category: technological_controls
    description: "Access to information and other associated assets shall be restricted in accordance with the established access control policy."
  - external_id: A.8.4
    name: Access to Source Code
    category: technological_controls
    description: "Read and write access to source code, development tools and software libraries shall be appropriately managed."
  - external_id: A.8.5
    name: Secure Authentication
    category: technological_controls
    description: "Secure authentication technologies and procedures shall be implemented."
  - external_id: A.8.7
    name: Protection Against Malware
    category: technological_controls
    description: "Protection against malware shall be implemented and supported by appropriate user awareness."
  - external_id: A.8.8
    name: Management of Technical Vulnerabilities
    category: technological_controls
    description: "Information about technical vulnerabilities of information systems shall be obtained."
  - external_id: A.8.9
    name: Configuration Management
    category: technological_controls
    description: "Configurations, including security configurations, of hardware, software, services and networks shall be established, documented, implemented, monitored and reviewed."
  - external_id: A.8.15
    name: Logging
    category: technological_controls
    description: "Logs that record activities, exceptions, faults and other relevant events shall be produced, stored, protected and analysed."
  - external_id: A.8.16
    name: Monitoring Activities
    category: technological_controls
    description: "Networks, systems and applications shall be monitored for anomalous behaviour."
  - external_id: A.8.19
    name: Installation of Software on Operational Systems
    category: technological_controls
    description: "Procedures and measures shall be implemented to securely manage software installation on operational systems."
  - external_id: A.8.24
    name: Use of Cryptography
    category: technological_controls
    description: "Rules for the effective use of cryptography shall be defined and implemented."
  - external_id: A.8.25
    name: Secure Development Life Cycle
    category: technological_controls
    description: "Rules for the secure development of software and systems shall be established and applied."
  - external_id: A.8.28
    name: Secure Coding
    category: technological_controls
    description: "Secure coding principles shall be applied to software development."
  - external_id: A.8.29
    name: Security Testing in Development and Acceptance
    category: technological_controls
    description: "Security testing processes shall be defined and implemented in the development life cycle."
  - external_id: A.8.32
    name: Change Management
    category: technological_controls
    description: "Changes to information processing facilities and information systems shall be subject to change management procedures."
  - external_id: A.8.34
    name: Protection of Information Systems During Audit Testing
    category: technological_controls
    description: "Audit tests and other assurance activities involving assessment of operational systems shall be planned and agreed between the tester and appropriate management."
